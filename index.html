<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Name Generator - Gerador de Nomes</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mine-styles.css">
</head>
<body>
    <div class="minecraft-bg"></div>
    
    <div class="container">
        <div class="wrapper">
            <div class="header">
                <h1>Minecraft Name Generator</h1>
                <p>⛏️ Crie nomes épicos para o seu personagem ⛏️</p>
            </div>

            <div class="generator-box">
                <div class="category-selector">
                    <button class="category-btn active" onclick="selectCategory('warrior')">⚔️ Guerreiro</button>
                    <button class="category-btn" onclick="selectCategory('builder')">🏗️ Construtor</button>
                    <button class="category-btn" onclick="selectCategory('mage')">🔮 Mago</button>
                    <button class="category-btn" onclick="selectCategory('ranger')">🏹 Arqueiro</button>
                    <button class="category-btn" onclick="selectCategory('miner')">⛏️ Mineiro</button>
                </div>

                <div class="display-box">
                    <div class="name-display">
                        <span id="generated-name">CreeperSlayer</span>
                    </div>
                    <button class="copy-btn" onclick="copyName()">📋 Copiar Nome</button>
                </div>

                <div class="generator-controls">
                    <label>
                        <input type="checkbox" id="include-numbers" checked>
                        Incluir números
                    </label>
                    <label>
                        <input type="checkbox" id="include-underscores" checked>
                        Incluir underscores
                    </label>
                </div>

                <button class="generate-btn" onclick="generateName()">
                    ✨ Gerar Novo Nome ✨
                </button>

                <div class="suggestions">
                    <h3>💡 Sugestões Geradas:</h3>
                    <div id="suggestions-list" class="suggestions-list"></div>
                </div>
            </div>

            <div class="footer">
                <p>Divirta-se gerando nomes épicos para sua próxima aventura! 🎮</p>
            </div>
        </div>
    </div>

    <script src="mine-script.js"></script>
</body>
</html>
